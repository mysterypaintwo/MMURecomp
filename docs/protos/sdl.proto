syntax = "proto2";

package mmu;

message SDL_Color {
  required int32 r = 1;
  required int32 g = 2;
  required int32 b = 3;
}

message SDL_Palette {
  required int32 ncolors = 1;
  repeated mmu.SDL_Color colors = 2;
}

message SDL_PixelFormat {
  optional mmu.SDL_Palette palette = 1;
  required uint32 bits_per_pixel = 2;
  required uint32 bytes_per_pixel = 3;
  required uint32 rloss = 4;
  required uint32 gloss = 5;
  required uint32 bloss = 6;
  required uint32 aloss = 7;
  required uint32 rshift = 8;
  required uint32 gshift = 9;
  required uint32 bshift = 10;
  required uint32 ashift = 11;
  required uint32 rmask = 12;
  required uint32 gmask = 13;
  required uint32 bmask = 14;
  required uint32 amask = 15;
}

message SDL_Rect {
  required int32 x = 1;
  required int32 y = 2;
  required int32 w = 3;
  required int32 h = 4;
}

message SDL_Surface {
  required uint32 flags = 1;
  optional mmu.SDL_PixelFormat pixel_format = 2;
  required int32 w = 3;
  required int32 h = 4;
  required uint32 pitch = 5;
  repeated bytes pixels = 6;
  required int32 locked = 7;
  required int32 format_version = 10;
  optional int32 ref_count = 11;
}

message PNG {
  repeated mmu.SDL_Surface surface = 1;
  repeated uint32 key = 2;
}
